name: Build and deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_VERSION: '10.0.x'
  NODE_VERSION: '24'
  API_PROJECT: NexCart-Backend/src/NexCart.API/NexCart.API.csproj

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: NexCart-Frontend/nexcart-web/package-lock.json

      - name: Test backend
        run: dotnet test NexCart-Backend/tests/NexCart.UnitTests --configuration Release

      # Also builds the React app into wwwroot/ (PublishFrontend target in NexCart.API.csproj)
      - name: Publish API and frontend
        run: dotnet publish ${{ env.API_PROJECT }} --configuration Release --output ./publish

      - uses: actions/upload-artifact@v4
        with:
          name: nexcart-app
          path: ./publish

  deploy:
    needs: build
    # Only from main, and only once the Azure variables below are configured in the repository
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.AZURE_WEBAPP_NAME != ''
    runs-on: ubuntu-latest
    environment: production
    permissions:
      id-token: write # lets azure/login sign in with OpenID Connect, so no Azure password is stored
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: nexcart-app
          path: ./publish

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          package: ./publish
